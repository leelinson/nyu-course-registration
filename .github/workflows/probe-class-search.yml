name: Probe class search

on:
  workflow_dispatch:
  push:
    branches: [milestone-3-sections]
    paths: [.github/workflows/probe-class-search.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect details fields
        run: |
          api='https://bulletins.nyu.edu/class-search/api/?page=fose&route'
          curl -sS -X POST "$api=details" -H 'Content-Type: application/json' \
            --data '{"group":"code:ECON-UA 1","key":"crn:5973","srcdb":"1274","matched":"crn:5973"}' -o d.json
          python3 -c "
          import json; d=json.load(open('d.json'))
          for k,v in d.items():
              if k!='all_sections': print(k, '=', repr(v)[:300])
          "
          curl -sS -X POST "$api=search" -H 'Content-Type: application/json' \
            --data '{"other":{"srcdb":"1274"},"criteria":[{"field":"subject","value":"FINC-UB"}]}' -o f.json
          python3 -c "
          import json,collections; d=json.load(open('f.json')); r=d['results']
          print('FINC-UB count', d['count'], len(r))
          print('instr nonempty', sum(1 for x in r if x.get('instr')), [x['instr'] for x in r if x.get('instr')][:5])
          print('stat values', collections.Counter(x['stat'] for x in r))
          print('schd values', collections.Counter(x['schd'] for x in r))
          print(json.dumps(r[0]))
          "
          curl -sS -X POST "$api=search" -H 'Content-Type: application/json' \
            --data '{"other":{"srcdb":"1274"},"criteria":[]}' -o all.json -w '%{http_code}\n'
          python3 -c "import json; d=json.load(open('all.json')); print('ALL', d.get('count'), len(d.get('results',[])), str(d)[:300])"
          for s in FMTV-UT MULT-UB; do
            curl -sS -X POST "$api=search" -H 'Content-Type: application/json' \
              --data "{\"other\":{\"srcdb\":\"1274\"},\"criteria\":[{\"field\":\"subject\",\"value\":\"$s\"}]}" -o s.json
            python3 -c "import json; d=json.load(open('s.json')); print('$s', d.get('count'), [x['code']+' '+x['no']+' '+x.get('instr','') for x in d['results'][:4]])"
          done
