name: Database

on:
  push:
    branches: [main]
  pull_request:

jobs:
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: planner
    steps:
      - uses: actions/checkout@v4

      - name: Check generated requirements SQL is up to date
        run: |
          python3 scripts/build_requirements_sql.py > /tmp/seed_requirements.sql
          diff -u supabase/seed_requirements.sql /tmp/seed_requirements.sql

      - name: Set up the database, twice (re-runs must be safe)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/planner
        run: |
          scripts/setup_database.sh
          scripts/setup_database.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scraper tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/planner
        run: |
          pip install -r scrapers/requirements.txt
          python3 -m pytest -q tests

      - name: Every pilot program has requirements
        run: |
          missing=$(psql -tAc "select count(*) from programs p where not exists (select 1 from requirement_groups g where g.program_id = p.id)")
          test "$missing" = "0"
